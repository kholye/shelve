[package]
name = "shelve-app"
version = "0.2.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "shelve"
path = "src/main.rs"

[dependencies]
shelve-core = { path = "../core" }
shelve-platform = { path = "../platform" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"

[dev-dependencies]
# Checks that captured combos are strings global-hotkey can parse.
global-hotkey = "0.10"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
